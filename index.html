<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마인팜 판매 효율 계산기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; padding-bottom: 60px; background-color: #f4f7f6; color: #333; position: relative; min-height: 100vh; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    
    /* 탭 스타일 */
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: none; background-color: #e0e6ed; color: #7f8c8d; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-button.active { background-color: #27ae60; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    input, select { flex: 1; min-width: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    button.btn-calc { padding: 12px 24px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button.btn-calc:hover { background-color: #219150; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
    th { background-color: #34495e; color: white; }
    .badge { padding: 5px 10px; border-radius: 15px; font-weight: bold; color: white; display: inline-block; }
    .high { background-color: #27ae60; }   /* 80% 이상 */
    .medium { background-color: #f39c12; } /* 50% ~ 79% */
    .low { background-color: #e74c3c; }    /* 50% 미만 */
    .btn-delete { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; color: white; border: none; border-radius: 3px; cursor: pointer; }
    .btn-delete:hover { background-color: #c0392b; }
    .info-text { font-size: 13px; color: #666; margin-top: -5px; margin-bottom: 10px; }

    /* 우측 하단 제작자 워터마크 */
    .creator-tag {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 13px;
      font-weight: bold;
      color: #7f8c8d;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      border: 1px solid #ddd;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>🌾 마인팜 판매 효율 계산기</h1>

  <!-- 메인 탭 (재배 / 해양) -->
  <div class="tab-container">
    <button class="tab-button active" onclick="switchCategory('crop')">🌱 재배 전문가 (요리)</button>
    <button class="tab-button" onclick="switchCategory('ocean')">🌊 해양 전문가 (공예품)</button>
  </div>

  <!-- 계산 영역 -->
  <div class="card">
    <h3 id="calcTitle">🌱 재배 전문가 - 요리 판매 효율 계산</h3>
    <p class="info-text">품목을 선택한 후 현재 판매가를 입력하면 효율이 자동 계산됩니다.</p>
    <div class="form-group">
      <select id="selectItem" onchange="updateMinMaxDisplay()">
        <option value="">-- 품목 선택 --</option>
      </select>
      <input type="number" id="currentPrice" placeholder="현재 판매가 입력 (G)">
      <button class="btn-calc" onclick="calculateEfficiency()">효율 계산하기</button>
    </div>
    <div id="priceInfo" class="info-text" style="display: none; font-weight: bold; color: #2c3e50;"></div>
  </div>

  <!-- 계산 결과 목록 -->
  <div class="card">
    <h3>📋 계산 결과 목록</h3>
    <table>
      <thead>
        <tr>
          <th>품목 이름</th>
          <th>최저가 / 최고가</th>
          <th>현재가</th>
          <th>판매 효율</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="resultTableBody">
        <!-- 결과 데이터가 들어갑니다 -->
      </tbody>
    </table>
  </div>

  <!-- 제작자 정보 (우측 하단 고정) -->
  <div class="creator-tag">제작자 : 우브</div>

  <script>
    // 1. 재배 전문가 데이터 (요리 15종)
    const cropDishes = [
      { name: "토마토 스파게티", minPrice: 259, maxPrice: 864 },
      { name: "어니언 링", minPrice: 307, maxPrice: 1026 },
      { name: "갈릭 케이크", minPrice: 226, maxPrice: 756 },
      { name: "삼겹살 토마토 찌개", minPrice: 611, maxPrice: 2039 },
      { name: "삼색 아이스크림", minPrice: 906, maxPrice: 3022 },
      { name: "마늘 양갈비 핫도그", minPrice: 513, maxPrice: 1713 },
      { name: "달콤 시리얼", minPrice: 773, maxPrice: 2578 },
      { name: "로스트 치킨 파이", minPrice: 640, maxPrice: 2134 },
      { name: "스윗 치킨 햄버거", minPrice: 970, maxPrice: 3234 },
      { name: "토마토 파인애플 피자", minPrice: 922, maxPrice: 3077 },
      { name: "양파 수프", minPrice: 1139, maxPrice: 3797 },
      { name: "허브 삼겹살 찜", minPrice: 894, maxPrice: 2982 },
      { name: "토마토 라자냐", minPrice: 1253, maxPrice: 4177 },
      { name: "딥 크림 빠네", minPrice: 1151, maxPrice: 3837 },
      { name: "트리플 소갈비 꼬치", minPrice: 1291, maxPrice: 4307 }
    ];

    // 2. 해양 전문가 데이터 (공예품 6종)
    const oceanCrafts = [
      { name: "조개껍데기 브로치", minPrice: 0, maxPrice: 50000 },
      { name: "푸른 향수병", minPrice: 0, maxPrice: 150000 },
      { name: "자개 손거울", minPrice: 0, maxPrice: 300000 },
      { name: "분홍 헤어핀", minPrice: 0, maxPrice: 500000 },
      { name: "자개 부채", minPrice: 0, maxPrice: 700000 },
      { name: "흑진주 시계", minPrice: 0, maxPrice: 1000000 }
    ];

    let currentCategory = 'crop';
    let calcResults = JSON.parse(localStorage.getItem('minefarmTabResults')) || { crop: [], ocean: [] };

    function init() {
      switchCategory('crop');
    }

    function switchCategory(category) {
      currentCategory = category;
      
      const buttons = document.querySelectorAll('.tab-button');
      buttons[0].classList.toggle('active', category === 'crop');
      buttons[1].classList.toggle('active', category === 'ocean');

      const title = document.getElementById('calcTitle');
      if (category === 'crop') {
        title.textContent = '🌱 재배 전문가 - 요리 판매 효율 계산';
      } else {
        title.textContent = '🌊 해양 전문가 - 공예품 판매 효율 계산';
      }

      document.getElementById('priceInfo').style.display = 'none';
      document.getElementById('currentPrice').value = '';

      updateSelectOptions();
      renderResults();
    }

    function updateSelectOptions() {
      const select = document.getElementById('selectItem');
      select.innerHTML = '<option value="">-- 품목 선택 --</option>';

      const list = currentCategory === 'crop' ? cropDishes : oceanCrafts;

      list.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.name;
        select.appendChild(opt);
      });
    }

    function updateMinMaxDisplay() {
      const selectIndex = document.getElementById('selectItem').value;
      const infoDiv = document.getElementById('priceInfo');
      const list = currentCategory === 'crop' ? cropDishes : oceanCrafts;

      if (selectIndex !== "") {
        const item = list[selectIndex];
        infoDiv.style.display = "block";
        infoDiv.textContent = `💡 [${item.name}] 최저가: ${item.minPrice.toLocaleString()} G | 최고가: ${item.maxPrice.toLocaleString()} G`;
      } else {
        infoDiv.style.display = "none";
      }
    }

    function calculateEfficiency() {
      const selectIndex = document.getElementById('selectItem').value;
      const currentPrice = parseFloat(document.getElementById('currentPrice').value);
      const list = currentCategory === 'crop' ? cropDishes : oceanCrafts;

      if (selectIndex === "") {
        alert('품목을 선택해 주세요.');
        return;
      }
      if (isNaN(currentPrice)) {
        alert('현재 판매가를 입력해 주세요.');
        return;
      }

      const item = list[selectIndex];
      const efficiency = item.maxPrice > 0 ? ((currentPrice / item.maxPrice) * 100).toFixed(1) : 0;

      calcResults[currentCategory].unshift({
        name: item.name,
        minPrice: item.minPrice,
        maxPrice: item.maxPrice,
        currentPrice: currentPrice,
        efficiency: parseFloat(efficiency)
      });

      localStorage.setItem('minefarmTabResults', JSON.stringify(calcResults));
      document.getElementById('currentPrice').value = '';
      renderResults();
    }

    function renderResults() {
      const tbody = document.getElementById('resultTableBody');
      tbody.innerHTML = '';

      const currentResults = calcResults[currentCategory] || [];

      currentResults.forEach((item, index) => {
        let badgeClass = 'low';
        if (item.efficiency >= 80) badgeClass = 'high';
        else if (item.efficiency >= 50) badgeClass = 'medium';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>${item.minPrice.toLocaleString()} G / ${item.maxPrice.toLocaleString()} G</td>
          <td>${item.currentPrice.toLocaleString()} G</td>
          <td><span class="badge ${badgeClass}">${item.efficiency}%</span></td>
          <td><button class="btn-delete" onclick="deleteResult(${index})">삭제</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteResult(index) {
      calcResults[currentCategory].splice(index, 1);
      localStorage.setItem('minefarmTabResults', JSON.stringify(calcResults));
      renderResults();
    }

    init();
  </script>
</body>
</html>
